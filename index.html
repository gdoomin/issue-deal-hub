<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>피나케스 | 실시간 이슈 &amp; 핫딜 에디토리얼 큐레이션</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7599505823176898" crossorigin="anonymous"></script>
  <script>
    (function () {
      try {
        if (localStorage.getItem('pinakes_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f6f2ea;
      --surface: #ffffff;
      --surface-sub: #faf7f2;
      --border: #e7e0d3;
      --text: #181a24;
      --text-muted: #6e6a61;
      --text-visited: #a5a096;
      --accent: #e25226;
      --accent-soft: #fff0ea;
      --deal: #1d64d8;
      --deal-soft: #edf4ff;
      --clean: #0e7c5b;
      --clean-soft: #eaf8f3;
      --ai: #6838d1;
      --ai-soft: #f4efff;
      --cross: #c8640a;
      --cross-soft: #fff6e8;
      --chip-bg: #efeae0;
      --chip-active-bg: #181a24;
      --chip-active-text: #ffffff;
      --shadow: 0 2px 10px rgba(24, 26, 36, 0.04);
      --promo-bg: linear-gradient(135deg, #fff9f2 0%, #fff2e6 100%);
      --promo-border: #f2cfb4;
    }

    html.dark {
      --bg: #14151b;
      --surface: #1c1e26;
      --surface-sub: #232631;
      --border: #2e3240;
      --text: #f3f1ec;
      --text-muted: #9b9992;
      --text-visited: #5c5e69;
      --accent: #ff7750;
      --accent-soft: rgba(255, 119, 80, 0.14);
      --deal: #6ca6ff;
      --deal-soft: rgba(108, 166, 255, 0.14);
      --clean: #3dd6a5;
      --clean-soft: rgba(61, 214, 165, 0.14);
      --ai: #b197fc;
      --ai-soft: rgba(177, 151, 252, 0.14);
      --cross: #fbbf24;
      --cross-soft: rgba(251, 191, 36, 0.14);
      --chip-bg: #262936;
      --chip-active-bg: #f3f1ec;
      --chip-active-text: #14151b;
      --shadow: none;
      --promo-bg: linear-gradient(135deg, #211f26 0%, #27211e 100%);
      --promo-border: #4a372a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.52;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(255, 255, 255, 0.92);
      border-top: 3px solid var(--accent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    html.dark .topbar {
      background: rgba(28, 30, 38, 0.92);
    }

    .topbar-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 14px 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-logo {
      height: 30px;
      width: auto;
      display: block;
    }

    html.dark .brand-logo {
      background: rgba(255, 255, 255, 0.94);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    @media (max-width: 540px) {
      .brand-sub { display: none; }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .updated-at {
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 560px) {
      .updated-at { display: none; }
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-pill.active-unread {
      background: var(--deal-soft);
      color: var(--deal);
      border-color: transparent;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 999px;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 9px;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .sort-select {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 6px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .guard-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .guard-chip.on {
      background: var(--clean-soft);
      color: var(--clean);
      border-color: rgba(14, 124, 91, 0.25);
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      margin-top: 4px;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      border: none;
      background: var(--chip-bg);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 14px 64px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .status-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .reset-read-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-card {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }

    @media (max-width: 520px) {
      .post-card {
        grid-template-columns: 30px 1fr;
        gap: 10px;
        padding: 13px 13px;
      }
    }

    .post-card.is-read {
      opacity: 0.62;
    }
    .post-card.is-read .post-title {
      color: var(--text-visited);
    }

    .rank-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2px;
    }

    .rank-num {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--accent);
      opacity: 0.9;
    }
    .post-card.is-read .rank-num {
      color: var(--text-visited);
    }

    .card-main {
      min-width: 0;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .src-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--chip-bg);
      color: var(--text);
    }
    .src-badge.deal {
      background: var(--deal-soft);
      color: var(--deal);
    }

    .mood-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .spread-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--cross-soft);
      color: var(--cross);
      border: 1px solid rgba(200, 100, 10, 0.2);
      cursor: pointer;
    }

    .read-tag {
      font-size: 11px;
      color: var(--text-visited);
      font-weight: 600;
      white-space: nowrap;
    }

    .post-title {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 15.5px;
      font-weight: 750;
      line-height: 1.44;
      cursor: pointer;
      word-break: keep-all;
    }
    .post-title:hover { color: var(--accent); }

    .reply-cnt {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-left: 4px;
    }

    .ai-subtitle {
      margin-top: 5px;
      font-size: 12.8px;
      color: var(--ai);
      font-weight: 600;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .meta-line {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mini-btn.has-comments { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }

    .drawer {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      font-size: 12.5px;
    }
    .drawer ul {
      margin: 4px 0 0;
      padding-left: 16px;
    }
    .drawer li { margin: 4px 0; }

    .opinion-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--ai-soft);
      color: var(--text);
      font-size: 12.5px;
    }

    .related-link {
      color: var(--text);
      text-decoration: none;
    }
    .related-link:hover { text-decoration: underline; color: var(--accent); }

    /* Native editorial recommendation card */
    .promo-card {
      background: var(--promo-bg);
      border: 1px solid var(--promo-border);
      border-left: 4px solid var(--accent);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .promo-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      margin-bottom: 5px;
    }

    .promo-title {
      font-size: 14.5px;
      font-weight: 800;
      margin: 0 0 3px;
      color: var(--text);
    }

    .promo-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .promo-cta {
      flex-shrink: 0;
      text-decoration: none;
      background: var(--text);
      color: var(--surface);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      .promo-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .promo-cta {
        align-self: flex-end;
      }
    }

    /* Briefing view */
    .briefing-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .briefing-header h2 { margin: 0 0 4px; font-size: 16px; }
    .briefing-header p { margin: 0; font-size: 12.5px; color: var(--text-muted); }

    .briefing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .brief-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .brief-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .brief-headline {
      font-size: 14.5px;
      font-weight: 750;
      color: var(--text);
      text-decoration: none;
      line-height: 1.4;
      display: block;
    }
    .brief-headline:hover { color: var(--accent); }

    .brief-summary {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Detail & Comment Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    @media (min-width: 640px) {
      .modal-sheet { border-radius: 18px; }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .modal-title { font-size: 15px; font-weight: 800; margin: 0; }
    .modal-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ad-slot-box {
      border: 1px dashed var(--border);
      background: var(--surface-sub);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-box {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
    }

    .detail-subtitle {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ai);
      margin-bottom: 8px;
    }

    .detail-summary-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.55;
    }
    .detail-summary-list li { margin: 4px 0; }

    .detail-cta-row {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .origin-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .detail-divider {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text);
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .comment-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
    }
    .comment-head {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .comment-nick { font-weight: 700; color: var(--text); }
    .comment-text { font-size: 13px; margin: 0; white-space: pre-wrap; }

    .modal-form {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
    }
    .modal-form-row { display: flex; gap: 8px; }
    .input-sm {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      outline: none;
    }
    .btn-primary {
      border: none;
      background: var(--accent);
      color: #ffffff;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <img src="assets/pinakes-logo.png" alt="피나케스" class="brand-logo" />
          <span class="brand-sub">오늘의 에디토리얼 브리핑</span>
          <span class="brand-badge" id="totalBadge">0건</span>
        </div>
        <div class="top-actions">
          <span class="updated-at" id="updatedAt">불러오는 중...</span>
          <button class="toggle-pill" id="unreadBtn" title="이미 읽은 글 숨기기">👁️ 안 읽은 글만</button>
          <button class="icon-btn" id="themeBtn" aria-label="테마 전환">🌙</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="issue">🔥 이슈·유머</button>
        <button class="tab-btn" data-tab="deal">🛍️ 핫딜·쇼핑</button>
        <button class="tab-btn" data-tab="briefing">📰 3분 브리핑</button>
        <button class="tab-btn" data-tab="all">📌 전체</button>
      </div>

      <div class="controls" id="controlsBar">
        <input id="searchInput" class="search-input" type="search" placeholder="키워드 검색 (예: 코스트코, 아이폰, 꿀팁...)" />
        <select id="sortSelect" class="sort-select" aria-label="정렬">
          <option value="cross">🔥 교차 화제성순</option>
          <option value="default">최신/기본순</option>
          <option value="views">조회수 높은순</option>
          <option value="comments">댓글 많은순</option>
          <option value="likes">추천 많은순</option>
        </select>
      </div>

      <div class="filter-bar" id="guardBar">
        <button class="guard-chip" id="guardNsfwBtn">🔞 후방 가림</button>
        <button class="guard-chip" id="guardPoliticsBtn">⚖️ 정치 가림</button>
        <button class="guard-chip" id="guardSportsBtn">⚽ 스포츠 가림</button>
      </div>

      <div class="chips-row" id="moodChips"></div>
      <div class="chips-row" id="sourceChips"></div>
    </div>
  </header>

  <main class="container">
    <div class="status-bar" id="statusBar">
      <span id="statusText">피드를 불러오고 있습니다...</span>
      <div class="status-actions">
        <button class="reset-read-btn" id="resetHiddenBtn" style="display:none;">숨김 초기화</button>
        <button class="reset-read-btn" id="resetReadBtn" style="display:none;">읽은 기록 초기화</button>
      </div>
    </div>
    <div id="contentArea"></div>
    <footer>
      피나케스는 각 커뮤니티의 공개 제목과 AI 요약·링크만 제공하며, 본문·이미지는 저장하지 않습니다.<br />
      게시중단 및 수집 제외 요청: gdoomin@gmail.com
    </footer>
  </main>

  <div class="modal-backdrop" id="commentModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modalPostTitle">상세 보기</h3>
          <div class="modal-sub" id="modalPostSub"></div>
        </div>
        <button class="icon-btn" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body">
        <div id="detailView"></div>
        <div class="detail-divider">💬 피나케스 댓글</div>
        <div id="commentList"></div>
      </div>
      <form class="modal-form" id="commentForm">
        <div class="modal-form-row">
          <input class="input-sm" id="nickInput" type="text" placeholder="닉네임 (기본: 익명)" style="width: 130px;" />
          <input class="input-sm" id="commentInput" type="text" placeholder="이 이슈에 대한 의견을 남겨보세요..." style="flex: 1;" required />
          <button class="btn-primary" type="submit">등록</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const MOOD_LABELS = {
      all: '전체 주제',
      humor: '😂 순수 유머',
      info: '💡 정보·꿀팁',
      it_econ: '💻 IT·경제',
      sports: '⚽ 스포츠·게임',
      life: '💛 일상·감동',
      politics_conflict: '🏛️ 정치·이슈'
    };

    const state = {
      items: [],
      briefing: [],
      updatedAt: '',
      aiEnabled: false,
      tab: 'issue',
      mood: 'all',
      source: 'all',
      search: '',
      sort: 'cross',
      hideNsfw: loadBool('pinakes_hide_nsfw', true),
      hidePolitics: loadBool('pinakes_hide_politics', true),
      hideSports: loadBool('pinakes_hide_sports', false),
      unreadOnly: loadBool('pinakes_unread_only', false),
      readIds: loadSet('pinakes_read_ids'),
      hiddenIds: loadSet('pinakes_hidden_ids'),
      comments: loadObj('pinakes_comments'),
      expandedClusters: new Set(),
      expandedSummaries: new Set(),
      activePost: null
    };

    function loadBool(k, def) {
      try {
        const v = localStorage.getItem(k);
        return v === null ? def : v === '1';
      } catch { return def; }
    }
    function loadSet(k) {
      try {
        return new Set(JSON.parse(localStorage.getItem(k) || '[]'));
      } catch { return new Set(); }
    }
    function loadObj(k) {
      try {
        return JSON.parse(localStorage.getItem(k) || '{}');
      } catch { return {}; }
    }
    function saveReadIds() {
      try {
        localStorage.setItem('pinakes_read_ids', JSON.stringify(Array.from(state.readIds).slice(-500)));
      } catch {}
    }
    function saveHiddenIds() {
      try {
        localStorage.setItem('pinakes_hidden_ids', JSON.stringify(Array.from(state.hiddenIds).slice(-500)));
      } catch {}
    }
    function markAsRead(id) {
      if (!id) return;
      state.readIds.add(id);
      saveReadIds();
      render();
    }
    function hidePost(id) {
      if (!id) return;
      state.hiddenIds.add(id);
      saveHiddenIds();
      render();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtNum(n) {
      return n ? Number(n).toLocaleString('ko-KR') : '0';
    }

    function isFilteredByGuard(x) {
      if (state.hideNsfw && x.isNsfw) return true;
      if (state.hidePolitics && (x.isPolitics || x.mood === 'politics_conflict')) return true;
      if (state.hideSports && (x.isSports || x.mood === 'sports')) return true;
      if (state.hideNsfw && state.hidePolitics && x.isSensitive) return true;
      return false;
    }

    function syncTopToggles() {
      const nsfwBtn = document.getElementById('guardNsfwBtn');
      const polBtn = document.getElementById('guardPoliticsBtn');
      const spoBtn = document.getElementById('guardSportsBtn');
      nsfwBtn.classList.toggle('on', state.hideNsfw);
      nsfwBtn.textContent = state.hideNsfw ? '🔞 후방 가림 ✓' : '🔞 후방 표시';
      polBtn.classList.toggle('on', state.hidePolitics);
      polBtn.textContent = state.hidePolitics ? '⚖️ 정치 가림 ✓' : '⚖️ 정치 표시';
      spoBtn.classList.toggle('on', state.hideSports);
      spoBtn.textContent = state.hideSports ? '⚽ 스포츠 가림 ✓' : '⚽ 스포츠 표시';

      const unreadBtn = document.getElementById('unreadBtn');
      unreadBtn.classList.toggle('active-unread', state.unreadOnly);
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    function getBaseItems() {
      let list = state.items.slice();
      if (state.tab === 'issue') list = list.filter(x => x.category === 'issue');
      else if (state.tab === 'deal') list = list.filter(x => x.category === 'deal');
      list = list.filter(x => !state.hiddenIds.has(x.id) && !isFilteredByGuard(x));
      return list;
    }

    function getFilteredItems() {
      let list = getBaseItems();
      if (state.unreadOnly) list = list.filter(x => !state.readIds.has(x.id));
      if (state.mood !== 'all' && state.tab !== 'deal') list = list.filter(x => x.mood === state.mood);
      if (state.source !== 'all') {
        list = list.filter(x => x.source === state.source || (x.communities && x.communities.includes(state.source)));
      }
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(x =>
          x.title.toLowerCase().includes(q) ||
          (x.aiSummaryTitle && x.aiSummaryTitle.toLowerCase().includes(q)) ||
          x.source.toLowerCase().includes(q)
        );
      }

      if (state.sort === 'cross') {
        list.sort((a, b) => (b.crossScore || 0) - (a.crossScore || 0));
      } else if (state.sort === 'views') {
        list.sort((a, b) => (b.views || 0) - (a.views || 0));
      } else if (state.sort === 'comments') {
        list.sort((a, b) => (b.comments || 0) - (a.comments || 0));
      } else if (state.sort === 'likes') {
        list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      }
      return list;
    }

    function renderChips() {
      const moodRow = document.getElementById('moodChips');
      const sourceRow = document.getElementById('sourceChips');
      const controlsBar = document.getElementById('controlsBar');
      const guardBar = document.getElementById('guardBar');

      if (state.tab === 'briefing') {
        moodRow.style.display = 'none';
        sourceRow.style.display = 'none';
        controlsBar.style.display = 'none';
        guardBar.style.display = 'flex';
        return;
      }

      controlsBar.style.display = 'flex';
      guardBar.style.display = 'flex';
      sourceRow.style.display = 'flex';

      if (state.tab === 'deal') {
        moodRow.style.display = 'none';
      } else {
        moodRow.style.display = 'flex';
        const keys = ['all', 'humor', 'info', 'it_econ'];
        if (!state.hideSports) keys.push('sports');
        keys.push('life');
        if (!state.hidePolitics) keys.push('politics_conflict');
        if ((state.hidePolitics && state.mood === 'politics_conflict') || (state.hideSports && state.mood === 'sports')) {
          state.mood = 'all';
        }

        moodRow.innerHTML = keys.map(k =>
          `<button class="chip ${state.mood === k ? 'active' : ''}" data-mood="${k}">${MOOD_LABELS[k]}</button>`
        ).join('');
      }

      const base = getBaseItems();
      const counts = {};
      base.forEach(x => { counts[x.source] = (counts[x.source] || 0) + 1; });
      const sources = ['all', ...Object.keys(counts)];
      sourceRow.innerHTML = sources.map(s => {
        const label = s === 'all' ? `전체 (${base.length})` : `${s} (${counts[s]})`;
        return `<button class="chip ${state.source === s ? 'active' : ''}" data-src="${escapeHtml(s)}">${escapeHtml(label)}</button>`;
      }).join('');
    }

    function renderPromoCard(kind) {
      if (kind === 'coshort') {
        return `
          <div class="promo-card">
            <div>
              <span class="promo-tag">추천 앱 · 코숏</span>
              <h4 class="promo-title">🛒 코스트코 오늘 할인·신상품, 장바구니에 담아두고 알림 받기</h4>
              <p class="promo-desc">매주 월·금 코스트코 매장 할인 정보와 KG당 단가 비교까지 한눈에 확인하세요.</p>
            </div>
            <a class="promo-cta" href="https://coshort.co.kr" target="_blank" rel="noopener">코숏 보기 ↗</a>
          </div>
        `;
      }
      return `
        <div class="promo-card">
          <div>
            <span class="promo-tag">추천 채널 · 코스트코숏핑정보</span>
            <h4 class="promo-title">📺 7.3만 구독자가 보는 코스트코 꿀템 1분 리뷰</h4>
            <p class="promo-desc">가성비 신상품부터 놓치기 아까운 마감 세일 정보까지 쇼츠로 빠르게 모아보세요.</p>
          </div>
          <a class="promo-cta" href="https://www.youtube.com/channel/UCVt2E7YdLB5WvrfGDzU3bTQ" target="_blank" rel="noopener">유튜브 보기 ↗</a>
        </div>
      `;
    }

    function renderBriefing() {
      const area = document.getElementById('contentArea');
      const items = state.briefing.filter(b => !isFilteredByGuard(b));

      document.getElementById('totalBadge').textContent = `${items.length}건`;
      document.getElementById('statusText').textContent = `출퇴근 3분 브리핑 · ${state.updatedAt}`;

      if (!items.length) {
        area.innerHTML = `<div class="empty">표시할 브리핑이 없습니다. 상단 필터를 조정해 보세요.</div>`;
        return;
      }

      area.innerHTML = `
        <div class="briefing-header">
          <h2>📰 오늘 꼭 짚고 넘어가야 할 핵심 이슈 Top ${items.length}</h2>
          <p>${state.updatedAt} 기준 · ${state.aiEnabled ? 'AI 에디토리얼 요약' : '실시간 화제글 기준'}</p>
        </div>
        <div class="briefing-grid">
          ${items.map((b, i) => `
            <div class="brief-card">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <span class="brief-tag">#${i + 1} ${escapeHtml(b.tag)}</span>
                  <span style="font-size:11px; color:var(--text-muted);">${escapeHtml((b.communities || []).join('·'))}</span>
                </div>
                <a class="brief-headline" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(b.id)}">
                  ${escapeHtml(b.headline)}
                </a>
                <p class="brief-summary" style="margin-top:6px;">${escapeHtml(b.summary)}</p>
              </div>
              <div style="display:flex; justify-content:flex-end;">
                <a class="mini-btn" style="text-decoration:none;" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(b.id)}">원문 보기 ↗</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderFeed() {
      const list = getFilteredItems();
      const area = document.getElementById('contentArea');
      document.getElementById('totalBadge').textContent = `${list.length}건`;

      const readCount = state.readIds.size;
      const hiddenCount = state.hiddenIds.size;
      document.getElementById('statusText').textContent =
        `표시 ${list.length}건${readCount ? ` · 읽은 글 ${readCount}건` : ''}${hiddenCount ? ` · 숨긴 글 ${hiddenCount}건` : ''}`;
      document.getElementById('resetReadBtn').style.display = readCount ? 'inline' : 'none';
      document.getElementById('resetHiddenBtn').style.display = hiddenCount ? 'inline' : 'none';

      if (!list.length) {
        area.innerHTML = `<div class="empty">조건에 맞는 글이 없습니다. 검색어나 상단 필터를 조정해 보세요.</div>`;
        return;
      }

      const chunks = [];
      list.forEach((it, idx) => {
        const isRead = state.readIds.has(it.id);
        const cCount = (state.comments[it.id] || []).length;
        const hasCross = (it.crossCount || 1) > 1 && it.relatedItems && it.relatedItems.length > 1;
        const isCrossOpen = state.expandedClusters.has(it.clusterId);
        const hasSummary = Array.isArray(it.aiThreeLineSummary) && it.aiThreeLineSummary.length > 0;
        const isSummaryOpen = state.expandedSummaries.has(it.id);

        const metaParts = [];
        if (it.views) metaParts.push(`조회 ${fmtNum(it.views)}`);
        if (it.likes) metaParts.push(`추천 ${fmtNum(it.likes)}`);
        if (it.comments) metaParts.push(`원글 댓글 ${fmtNum(it.comments)}`);
        if (it.time_label) metaParts.push(it.time_label);

        const hoverTip = hasSummary ? it.aiThreeLineSummary.join(' / ') : '';
        const crossLabel = it.spreadLabel || `🔥 ${it.crossCount}곳 동시 화제`;

        chunks.push(`
          <article class="post-card ${isRead ? 'is-read' : ''}">
            <div class="rank-col">
              <span class="rank-num">${String(idx + 1).padStart(2, '0')}</span>
            </div>
            <div class="card-main">
              <div class="card-top">
                <div class="badges">
                  <span class="src-badge ${it.category === 'deal' ? 'deal' : ''}">${escapeHtml(it.source)}</span>
                  ${it.mood && MOOD_LABELS[it.mood] && it.category !== 'deal' ? `<span class="mood-badge">${MOOD_LABELS[it.mood]}</span>` : ''}
                  ${hasCross ? `<button class="spread-badge" data-toggle-cluster="${escapeHtml(it.clusterId)}">${escapeHtml(crossLabel)} · ${escapeHtml(it.communities.join('·'))} ${isCrossOpen ? '▲' : '▼'}</button>` : ''}
                </div>
                ${isRead ? `<span class="read-tag">✓ 읽음</span>` : ''}
              </div>

              <button type="button" class="post-title"
                 data-open-post="${escapeHtml(it.id)}" title="${escapeHtml(hoverTip)}">
                ${escapeHtml(it.title)}${it.comments ? `<span class="reply-cnt">[${it.comments}]</span>` : ''}
              </button>

              ${it.aiSummaryTitle ? `<div class="ai-subtitle">✨ ${escapeHtml(it.aiSummaryTitle)}</div>` : ''}

              <div class="card-bottom">
                <span class="meta-line">${escapeHtml(metaParts.join(' · ') || '방금')}</span>
                <div class="card-actions">
                  ${hasSummary ? `<button class="mini-btn" data-toggle-summary="${escapeHtml(it.id)}">📋 3줄 요약 ${isSummaryOpen ? '▲' : '▼'}</button>` : ''}
                  <button class="mini-btn ${cCount ? 'has-comments' : ''}" data-open-comment="${escapeHtml(it.id)}">💬 댓글${cCount ? ` ${cCount}` : ''}</button>
                  <button class="mini-btn" data-hide-post="${escapeHtml(it.id)}" title="이 글 숨기기">🙈</button>
                </div>
              </div>

              ${isSummaryOpen && hasSummary ? `
                <div class="drawer">
                  <strong>📋 핵심 요약</strong>
                  <ul>${it.aiThreeLineSummary.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
                </div>
              ` : ''}

              ${isCrossOpen && hasCross ? `
                <div class="drawer">
                  <strong>🔗 묶인 커뮤니티 글 (${it.relatedItems.length}건)</strong>
                  <ul>
                    ${it.relatedItems.map(m => `
                      <li>
                        <span style="font-weight:700;">[${escapeHtml(m.source)}]</span>
                        <a class="related-link" href="${escapeHtml(m.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(it.id)}">${escapeHtml(m.title)}</a>
                      </li>
                    `).join('')}
                  </ul>
                  ${it.opinionCompare ? `<div class="opinion-box"><strong>⚖️ 여론 비교:</strong> ${escapeHtml(it.opinionCompare)}</div>` : ''}
                </div>
              ` : ''}
            </div>
          </article>
        `);

        if (idx === 4) chunks.push(renderPromoCard('coshort'));
        if (idx === 10) chunks.push(renderPromoCard('youtube'));
      });

      area.innerHTML = `<div class="feed-list">${chunks.join('')}</div>`;
    }

    function render() {
      syncTopToggles();
      renderChips();
      if (state.tab === 'briefing') renderBriefing();
      else renderFeed();
    }

    function openCommentModal(postId) {
      const post = state.items.find(x => x.id === postId);
      if (!post) return;
      state.activePost = post;
      markAsRead(post.id);
      document.getElementById('modalPostTitle').textContent = post.title;

      const meta = [post.source];
      if (post.views) meta.push(`조회 ${fmtNum(post.views)}`);
      if (post.likes) meta.push(`추천 ${fmtNum(post.likes)}`);
      if (post.comments) meta.push(`원글 댓글 ${fmtNum(post.comments)}`);
      if (post.time_label) meta.push(post.time_label);
      document.getElementById('modalPostSub').textContent = meta.join(' · ');

      const hasSummary = Array.isArray(post.aiThreeLineSummary) && post.aiThreeLineSummary.length > 0;
      const hasCross = (post.crossCount || 1) > 1 && post.relatedItems && post.relatedItems.length > 1;
      document.getElementById('detailView').innerHTML = `
        <div class="ad-slot-box" id="detailTopAd">광고 영역 · Google AdSense (ca-pub-7599505823176898)</div>

        <div class="detail-box">
          ${post.aiSummaryTitle ? `<div class="detail-subtitle">✨ ${escapeHtml(post.aiSummaryTitle)}</div>` : ''}
          ${hasSummary ? `
            <ul class="detail-summary-list">
              ${post.aiThreeLineSummary.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
            </ul>
          ` : `<div style="font-size:13px; color:var(--text-muted);">원문 게시물에서 자세한 내용을 확인하고 아래에 자유롭게 댓글을 남겨보세요.</div>`}
          ${post.opinionCompare ? `<div class="opinion-box"><strong>⚖️ 여론 비교:</strong> ${escapeHtml(post.opinionCompare)}</div>` : ''}
          ${hasCross ? `
            <div style="margin-top:10px; font-size:12.5px;">
              <strong>🔗 함께 화제된 글 (${post.relatedItems.length}건)</strong>
              <ul class="detail-summary-list" style="margin-top:4px;">
                ${post.relatedItems.map(m => `<li>[${escapeHtml(m.source)}] <a class="related-link" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.title)}</a></li>`).join('')}
              </ul>
            </div>
          ` : ''}
          <div class="detail-cta-row">
            <a class="origin-btn" href="${escapeHtml(post.url)}" target="_blank" rel="noopener">원문 보러 가기 ↗</a>
          </div>
        </div>

        <div class="ad-slot-box" id="detailBottomAd">광고 영역 · Google AdSense (ca-pub-7599505823176898)</div>
      `;

      renderComments();
      document.getElementById('commentModal').classList.add('open');
      render();
    }

    function renderComments() {
      if (!state.activePost) return;
      const list = state.comments[state.activePost.id] || [];
      const box = document.getElementById('commentList');
      if (!list.length) {
        box.innerHTML = `<div style="text-align:center; padding:18px; color:var(--text-muted); font-size:13px;">첫 댓글을 남겨보세요!</div>`;
        return;
      }
      box.innerHTML = list.map((c, idx) => `
        <div class="comment-item">
          <div class="comment-head">
            <span class="comment-nick">${escapeHtml(c.nick || '익명')}</span>
            <span>${escapeHtml(c.time)} · <button type="button" data-del-comment="${idx}" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px;padding:0;">삭제</button></span>
          </div>
          <p class="comment-text">${escapeHtml(c.text)}</p>
        </div>
      `).join('');
    }

    // Event bindings
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tab = btn.dataset.tab;
        state.source = 'all';
        state.mood = 'all';
        render();
      });
    });

    document.getElementById('guardNsfwBtn').addEventListener('click', () => {
      state.hideNsfw = !state.hideNsfw;
      try { localStorage.setItem('pinakes_hide_nsfw', state.hideNsfw ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('guardPoliticsBtn').addEventListener('click', () => {
      state.hidePolitics = !state.hidePolitics;
      try { localStorage.setItem('pinakes_hide_politics', state.hidePolitics ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('guardSportsBtn').addEventListener('click', () => {
      state.hideSports = !state.hideSports;
      try { localStorage.setItem('pinakes_hide_sports', state.hideSports ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('unreadBtn').addEventListener('click', () => {
      state.unreadOnly = !state.unreadOnly;
      try { localStorage.setItem('pinakes_unread_only', state.unreadOnly ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('pinakes_theme', dark ? 'dark' : 'light'); } catch {}
      syncTopToggles();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      state.search = e.target.value;
      render();
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById('resetReadBtn').addEventListener('click', () => {
      state.readIds.clear();
      saveReadIds();
      render();
    });

    document.getElementById('resetHiddenBtn').addEventListener('click', () => {
      state.hiddenIds.clear();
      saveHiddenIds();
      render();
    });

    document.getElementById('moodChips').addEventListener('click', e => {
      const btn = e.target.closest('[data-mood]');
      if (!btn) return;
      state.mood = btn.dataset.mood;
      render();
    });

    document.getElementById('sourceChips').addEventListener('click', e => {
      const btn = e.target.closest('[data-src]');
      if (!btn) return;
      state.source = btn.dataset.src;
      render();
    });

    document.getElementById('contentArea').addEventListener('click', e => {
      const openBtn = e.target.closest('[data-open-post]');
      if (openBtn) {
        openCommentModal(openBtn.dataset.openPost);
        return;
      }

      const hideBtn = e.target.closest('[data-hide-post]');
      if (hideBtn) {
        hidePost(hideBtn.dataset.hidePost);
        return;
      }

      const readLink = e.target.closest('[data-read-id]');
      if (readLink) markAsRead(readLink.dataset.readId);

      const clBtn = e.target.closest('[data-toggle-cluster]');
      if (clBtn) {
        const cid = clBtn.dataset.toggleCluster;
        if (state.expandedClusters.has(cid)) state.expandedClusters.delete(cid);
        else state.expandedClusters.add(cid);
        render();
        return;
      }

      const sumBtn = e.target.closest('[data-toggle-summary]');
      if (sumBtn) {
        const sid = sumBtn.dataset.toggleSummary;
        if (state.expandedSummaries.has(sid)) state.expandedSummaries.delete(sid);
        else state.expandedSummaries.add(sid);
        render();
        return;
      }

      const cmtBtn = e.target.closest('[data-open-comment]');
      if (cmtBtn) {
        openCommentModal(cmtBtn.dataset.openComment);
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('commentModal').classList.remove('open');
    });

    document.getElementById('commentModal').addEventListener('click', e => {
      if (e.target.id === 'commentModal') {
        document.getElementById('commentModal').classList.remove('open');
      }
    });

    document.getElementById('commentList').addEventListener('click', e => {
      const del = e.target.closest('[data-del-comment]');
      if (!del || !state.activePost) return;
      const idx = Number(del.dataset.delComment);
      const arr = state.comments[state.activePost.id] || [];
      arr.splice(idx, 1);
      state.comments[state.activePost.id] = arr;
      try { localStorage.setItem('pinakes_comments', JSON.stringify(state.comments)); } catch {}
      renderComments();
      render();
    });

    document.getElementById('commentForm').addEventListener('submit', e => {
      e.preventDefault();
      if (!state.activePost) return;
      const nick = document.getElementById('nickInput').value.trim() || '익명';
      const text = document.getElementById('commentInput').value.trim();
      if (!text) return;
      const now = new Date();
      const time = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const arr = state.comments[state.activePost.id] || [];
      arr.push({ nick, text, time });
      state.comments[state.activePost.id] = arr;
      try { localStorage.setItem('pinakes_comments', JSON.stringify(state.comments)); } catch {}
      document.getElementById('commentInput').value = '';
      renderComments();
      render();
    });

    async function init() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        state.items = data.items || [];
        state.briefing = data.briefing || [];
        state.updatedAt = data.updated_at || '';
        state.aiEnabled = Boolean(data.ai_enabled);
        document.getElementById('updatedAt').textContent = state.updatedAt;
        render();
      } catch (err) {
        document.getElementById('contentArea').innerHTML =
          `<div class="empty">피드를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`;
      }
    }

    init();
  </script>
</body>
</html>
