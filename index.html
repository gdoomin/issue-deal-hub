  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-hover: #f9fafb;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --text-visited: #9ca3af;
      --accent: #ef4444;
      --accent-soft: #fef2f2;
      --deal: #2563eb;
      --deal-soft: #eff6ff;
      --chip-bg: #f3f4f6;
      --chip-active-bg: #111827;
      --chip-active-text: #ffffff;
    }

    html.dark {
      --bg: #0f1115;
      --surface: #181b21;
      --surface-hover: #1f232b;
      --border: #272b36;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-visited: #6b7280;
      --accent: #f87171;
      --accent-soft: rgba(248, 113, 113, 0.14);
      --deal: #60a5fa;
      --deal-soft: rgba(96, 165, 250, 0.14);
      --chip-bg: #232732;
      --chip-active-bg: #f3f4f6;
      --chip-active-text: #111827;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.45;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 14px 8px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .updated-at {
      font-size: 11px;
      color: var(--text-muted);
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 13px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-bg);
    }

    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 160px;
    }

    .search-box input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .sort-select {
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 2px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-bg);
    }

    .container {
      max-width: 860px;
      margin: 10px auto 36px;
      padding: 0 10px;
    }

    .feed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .post-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s ease;
    }

    .post-row:last-child { border-bottom: none; }
    .post-row:hover { background: var(--surface-hover); }

    .post-row.visited .post-title {
      color: var(--text-visited);
    }

    .rank-num {
      min-width: 22px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: right;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .post-body {
      flex: 1;
      min-width: 0;
    }

    .post-title-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .post-title-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .src-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .src-clien { background: #e0f2fe; color: #0369a1; }
    .src-bobae { background: #fee2e2; color: #b91c1c; }
    .src-humoruniv { background: #fef3c7; color: #b45309; }
    .src-ppomppu { background: #ede9fe; color: #6d28d9; }
    .src-clien_deal { background: #dcfce7; color: #15803d; }
    .src-damoang_deal { background: #ffedd5; color: #c2410c; }

    html.dark .src-clien { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; }
    html.dark .src-bobae { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    html.dark .src-humoruniv { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    html.dark .src-ppomppu { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }
    html.dark .src-clien_deal { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    html.dark .src-damoang_deal { background: rgba(249, 115, 22, 0.2); color: #fdba74; }

    .post-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .cmt-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .post-meta-row {
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .post-meta {
      display: flex;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
    }

    .comment-btn {
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--text);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .comment-btn.has-comments {
      background: var(--deal-soft);
      color: var(--deal);
      border-color: transparent;
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Comment Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 560px;
      max-height: 85dvh;
      background: var(--surface);
      color: var(--text);
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-sheet {
        border-radius: 16px;
      }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .modal-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--deal);
      text-decoration: none;
      font-weight: 600;
    }

    .modal-close {
      border: none;
      background: var(--chip-bg);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .comment-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
    }

    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .comment-author {
      font-weight: 700;
    }

    .comment-time {
      color: var(--text-muted);
      font-size: 11px;
    }

    .comment-del {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
    }

    .comment-text {
      font-size: 13.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-form {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-form-row {
      display: flex;
      gap: 8px;
    }

    .comment-input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .nick-input { width: 110px; }
    .body-input { flex: 1; }

    .submit-btn {
      border: none;
      background: var(--deal);
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .comment-note {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">

        <div class="top-actions">

          <button class="icon-btn" id="themeToggle" type="button" title="다크모드 전환">🌙</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="issue" type="button">🔥 이슈·유머</button>
        <button class="tab-btn" data-tab="deal" type="button">🛍️ 핫딜·쇼핑</button>
        <button class="tab-btn" data-tab="all" type="button">📌 전체</button>
      </div>

      <div class="controls-row">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="키워드 검색 (예: 코스트코, 알리, 삼성...)" />
        </div>
        <select class="sort-select" id="sortSelect" aria-label="정렬">
          <option value="default">최신/기본순</option>
          <option value="views">조회수 높은순</option>
          <option value="comments">원글 댓글 많은순</option>
          <option value="likes">추천 많은순</option>
        </select>
      </div>

      <div class="chips" id="sourceChips"></div>
    </div>
  </header>

  <main class="container">
    <section class="feed-card" id="feedList">

    <p class="footer-note">

    </p>
  </main>

  <!-- Comment Modal -->
  <div class="modal-backdrop" id="commentModal" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <a class="modal-link" id="modalOriginLink" href="#" target="_blank" rel="noopener noreferrer">원문 글 보기 ↗</a>
        </div>
        <button class="modal-close" id="modalCloseBtn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="comment-list" id="commentList"></div>
      <form class="comment-form" id="commentForm">
        <div class="comment-form-row">
          <input class="comment-input nick-input" id="nickInput" type="text" maxlength="16" placeholder="닉네임" />
          <input class="comment-input body-input" id="bodyInput" type="text" maxlength="300" placeholder="여기에 댓글을 남겨보세요" required />
          <button class="submit-btn" type="submit">등록</button>
        </div>
        <div class="comment-note">현재 댓글은 이 브라우저에 저장됩니다. (공용 서버 DB 연동 시 모든 사용자와 공유 가능)</div>
      </form>
    </div>
  </div>

    let state = {
      items: [],
      updatedAt: "",
      tab: "issue",
      source: "all",
      query: "",
      sort: "default",
      visited: new Set(JSON.parse(localStorage.getItem("visited_urls") || "[]")),
      comments: JSON.parse(localStorage.getItem("post_comments_v1") || "{}"),
      activePostUrl: null,
    };

    const themeBtn = document.getElementById("themeToggle");
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
      themeBtn.textContent = "☀️";
    }
    themeBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      themeBtn.textContent = isDark ? "☀️" : "🌙";
    });

    function formatNum(n) {
      if (!n) return "0";
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "만";
      return n.toLocaleString("ko-KR");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function saveComments() {
      localStorage.setItem("post_comments_v1", JSON.stringify(state.comments));
    }

    function getFilteredItems() {
      let list = state.items.filter((it) => {
        if (state.tab !== "all" && it.category !== state.tab) return false;
        if (state.source !== "all" && it.source_id !== state.source) return false;
        if (state.query) {
          const q = state.query.toLowerCase();
          if (!it.title.toLowerCase().includes(q) && !it.source.toLowerCase().includes(q)) return false;
        }
        return true;
      });

      if (state.sort === "views") {
        list = [...list].sort((a, b) => (b.views || 0) - (a.views || 0));
      } else if (state.sort === "comments") {
        list = [...list].sort((a, b) => (b.comments || 0) - (a.comments || 0));
      } else if (state.sort === "likes") {
        list = [...list].sort((a, b) => (b.likes || 0) - (a.likes || 0));
      }
      return list;
    }

    function renderChips() {
      const box = document.getElementById("sourceChips");
      const base = state.items.filter((it) => state.tab === "all" || it.category === state.tab);
      const map = new Map();
      for (const it of base) {
        if (!map.has(it.source_id)) map.set(it.source_id, { id: it.source_id, name: it.source, count: 0 });
        map.get(it.source_id).count++;
      }

      const chips = [{ id: "all", name: "전체", count: base.length }, ...map.values()];
      box.innerHTML = chips
        .map(
          (c) =>
            `<button class="chip ${state.source === c.id ? "active" : ""}" data-src="${c.id}" type="button">${escapeHtml(c.name)} (${c.count})</button>`
        )
        .join("");

      box.querySelectorAll(".chip").forEach((el) => {
        el.addEventListener("click", () => {
          state.source = el.dataset.src;
          render();
        });
      });
    }

    function renderList() {
      const container = document.getElementById("feedList");
      const list = getFilteredItems();
      document.getElementById("totalBadge").textContent = `${list.length}건`;

      if (!list.length) {
        container.innerHTML = `<div class="empty-state">조건에 맞는 게시글이 없습니다.</div>`;
        return;
      }

      container.innerHTML = list
        .map((it, idx) => {
          const visited = state.visited.has(it.url) ? "visited" : "";
          const metaParts = [];
          if (it.views) metaParts.push(`조회 ${formatNum(it.views)}`);
          if (it.likes) metaParts.push(`추천 ${formatNum(it.likes)}`);
          if (it.time_label) metaParts.push(escapeHtml(it.time_label));
          const cmtHtml = it.comments ? `<span class="cmt-badge">[${it.comments}]</span>` : "";
          const localCmts = (state.comments[it.url] || []).length;

          return `
            <div class="post-row ${visited}" data-url="${escapeHtml(it.url)}">
              <div class="rank-num">${idx + 1}</div>
              <div class="post-body">
                <a class="post-title-link" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">
                  <div class="post-title-line">
                    <span class="src-tag src-${escapeHtml(it.source_id)}">${escapeHtml(it.source)}</span>
                    <span class="post-title">${escapeHtml(it.title)}</span>
                    ${cmtHtml}
                  </div>
                </a>
                <div class="post-meta-row">
                  <div class="post-meta">${metaParts.join(" · ")}</div>
                  <button class="comment-btn ${localCmts ? "has-comments" : ""}" type="button" data-open-comment="${escapeHtml(it.url)}">
                    💬 댓글${localCmts ? ` ${localCmts}` : ""}
                  </button>
                </div>
              </div>
            </div>
          `;
        })
        .join("");

      container.querySelectorAll(".post-title-link").forEach((el) => {
        el.addEventListener("click", () => {
          const row = el.closest(".post-row");
          const u = row.dataset.url;
          state.visited.add(u);
          localStorage.setItem("visited_urls", JSON.stringify([...state.visited].slice(-300)));
          row.classList.add("visited");
        });
      });

      container.querySelectorAll("[data-open-comment]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openCommentModal(btn.dataset.openComment);
        });
      });
    }

    function openCommentModal(url) {
      const item = state.items.find((x) => x.url === url);
      if (!item) return;
      state.activePostUrl = url;
      document.getElementById("modalTitle").textContent = `[${item.source}] ${item.title}`;
      document.getElementById("modalOriginLink").href = item.url;
      document.getElementById("nickInput").value = localStorage.getItem("comment_nick") || "익명";
      renderModalComments();
      document.getElementById("commentModal").classList.add("open");
      document.getElementById("commentModal").setAttribute("aria-hidden", "false");
    }

    function closeCommentModal() {
      document.getElementById("commentModal").classList.remove("open");
      document.getElementById("commentModal").setAttribute("aria-hidden", "true");
      state.activePostUrl = null;
    }

    function renderModalComments() {
      const listEl = document.getElementById("commentList");
      const list = state.comments[state.activePostUrl] || [];
      if (!list.length) {
        listEl.innerHTML = `<div class="empty-state" style="padding:24px 10px;">첫 댓글을 남겨보세요!</div>`;
        return;
      }
      listEl.innerHTML = list
        .map(
          (c, idx) => `
          <div class="comment-item">
            <div class="comment-head">
              <span class="comment-author">${escapeHtml(c.nick)}</span>
              <span>
                <span class="comment-time">${escapeHtml(c.time)}</span>
                <button class="comment-del" type="button" data-del-idx="${idx}">삭제</button>
              </span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `
        )
        .join("");

      listEl.querySelectorAll("[data-del-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.delIdx);
          state.comments[state.activePostUrl].splice(i, 1);
          saveComments();
          renderModalComments();
          renderList();
        });
      });
    }

    document.getElementById("modalCloseBtn").addEventListener("click", closeCommentModal);
    document.getElementById("commentModal").addEventListener("click", (e) => {
      if (e.target.id === "commentModal") closeCommentModal();
    });

    document.getElementById("commentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!state.activePostUrl) return;
      const nick = document.getElementById("nickInput").value.trim() || "익명";
      const bodyEl = document.getElementById("bodyInput");
      const text = bodyEl.value.trim();
      if (!text) return;

      localStorage.setItem("comment_nick", nick);
      const now = new Date();
      const time = now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      if (!state.comments[state.activePostUrl]) state.comments[state.activePostUrl] = [];
      state.comments[state.activePostUrl].push({ nick, text, time });
      saveComments();
      bodyEl.value = "";
      renderModalComments();
      renderList();
    });

    function render() {
      renderChips();
      renderList();
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.tab = btn.dataset.tab;
        state.source = "all";
        render();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.query = e.target.value.trim();
      renderList();
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      state.sort = e.target.value;
      renderList();
    });

    async function init() {
      let data = FALLBACK_DATA;
      try {
        const res = await fetch("./data.json", { cache: "no-store" });
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.items) && json.items.length) {
            data = json;
          }
        }
      } catch (_) {}

      state.items = data.items || [];
      state.updatedAt = data.updated_at || "";
      document.getElementById("updatedAt").textContent = state.updatedAt ? `갱신 ${state.updatedAt}` : "";
      render();
    }

    init();
  </script>
