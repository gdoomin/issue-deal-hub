<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>피나케스 | 실시간 이슈 &amp; 핫딜 모음</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pinakes_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-sub: #f9fafb;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --text-visited: #9ca3af;
      --accent: #ef4444;
      --accent-soft: #fef2f2;
      --deal: #2563eb;
      --deal-soft: #eff6ff;
      --clean: #059669;
      --clean-soft: #ecfdf5;
      --ai: #6d28d9;
      --ai-soft: #f5f3ff;
      --cross: #d97706;
      --cross-soft: #fffbeb;
      --chip-bg: #f3f4f6;
      --chip-active-bg: #111827;
      --chip-active-text: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    html.dark {
      --bg: #0d0f14;
      --surface: #161922;
      --surface-sub: #1d212d;
      --border: #262b38;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-visited: #525866;
      --accent: #f87171;
      --accent-soft: rgba(248, 113, 113, 0.14);
      --deal: #60a5fa;
      --deal-soft: rgba(96, 165, 250, 0.14);
      --clean: #34d399;
      --clean-soft: rgba(52, 211, 153, 0.14);
      --ai: #a78bfa;
      --ai-soft: rgba(167, 139, 250, 0.14);
      --cross: #fbbf24;
      --cross-soft: rgba(251, 191, 36, 0.14);
      --chip-bg: #222633;
      --chip-active-bg: #f3f4f6;
      --chip-active-text: #111827;
      --shadow: none;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 10px 14px 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-logo {
      height: 30px;
      width: auto;
      display: block;
    }

    html.dark .brand-logo {
      background: rgba(255, 255, 255, 0.94);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .updated-at {
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .updated-at { display: none; }
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-pill.active-clean {
      background: var(--clean-soft);
      border-color: var(--clean);
      color: var(--clean);
    }

    .toggle-pill.active-unread {
      background: var(--deal-soft);
      border-color: var(--deal);
      color: var(--deal);
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 13px;
      cursor: pointer;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 7px 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-bg);
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--deal); }

    .sort-select {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chips-row + .chips-row { margin-top: 6px; }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      border: none;
      background: var(--chip-bg);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 12px 14px 64px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .reset-read-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 15px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s ease;
    }

    .post-card.is-read {
      opacity: 0.72;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .rank-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .src-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--chip-bg);
      color: var(--text);
    }

    .src-badge.deal {
      background: var(--deal-soft);
      color: var(--deal);
    }

    .mood-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-sub);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .cross-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--cross-soft);
      color: var(--cross);
      border: 1px solid transparent;
      cursor: pointer;
    }

    .read-tag {
      font-size: 11px;
      color: var(--text-visited);
      font-weight: 600;
    }

    .post-title {
      display: block;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      line-height: 1.42;
      word-break: keep-all;
    }

    .post-card.is-read .post-title {
      color: var(--text-visited);
    }

    .post-title:hover { text-decoration: underline; }

    .reply-cnt {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      margin-left: 4px;
    }

    .ai-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: var(--ai);
      background: var(--ai-soft);
      padding: 4px 9px;
      border-radius: 8px;
      display: inline-block;
      line-height: 1.38;
    }

    .card-bottom {
      margin-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-line {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.has-comments {
      border-color: var(--deal);
      color: var(--deal);
      background: var(--deal-soft);
    }

    .drawer {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .drawer ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }

    .drawer li {
      margin-bottom: 4px;
    }

    .opinion-box {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 12.5px;
      color: var(--text);
    }

    .related-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .related-link:hover { text-decoration: underline; }

    /* Briefing cards */
    .briefing-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .briefing-header h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .briefing-header p {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .briefing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .brief-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .brief-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--ai);
      background: var(--ai-soft);
      padding: 2px 8px;
      border-radius: 999px;
      align-self: flex-start;
    }

    .brief-headline {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      line-height: 1.38;
    }
    .brief-headline:hover { text-decoration: underline; }

    .brief-summary {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .empty {
      text-align: center;
      padding: 46px 16px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Comment modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      max-height: 82vh;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-sheet { border-radius: 16px; }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .modal-title { font-size: 15px; font-weight: 700; margin: 0; }
    .modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
    }

    .comment-item {
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .comment-head {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .comment-del {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .modal-form {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-form-row {
      display: flex;
      gap: 8px;
    }

    .input-sm {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }

    .btn-primary {
      border: none;
      background: var(--deal);
      color: #ffffff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <img src="assets/pinakes-logo.png" alt="피나케스" class="brand-logo" />
          <span class="brand-badge" id="totalBadge">0건</span>
        </div>
        <div class="top-actions">
          <span class="updated-at" id="updatedAt">불러오는 중...</span>
          <button class="toggle-pill" id="cleanBtn" title="정치·갈등·혐오·선정 글 숨기기">🧹 클린 모드</button>
          <button class="toggle-pill" id="unreadBtn" title="이미 읽은 글 숨기기">👁️ 안 읽은 글만</button>
          <button class="icon-btn" id="themeBtn" aria-label="테마 전환">🌙</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="issue">🔥 이슈·유머</button>
        <button class="tab-btn" data-tab="deal">🛍️ 핫딜·쇼핑</button>
        <button class="tab-btn" data-tab="briefing">📰 3분 브리핑</button>
        <button class="tab-btn" data-tab="all">📌 전체</button>
      </div>

      <div class="controls" id="controlsBar">
        <input id="searchInput" class="search-input" type="search" placeholder="키워드 검색 (예: 코스트코, 아이폰, 꿀팁...)" />
        <select id="sortSelect" class="sort-select" aria-label="정렬">
          <option value="cross">🔥 교차 화제성순</option>
          <option value="default">최신/기본순</option>
          <option value="views">조회수 높은순</option>
          <option value="comments">댓글 많은순</option>
          <option value="likes">추천 많은순</option>
        </select>
      </div>

      <div class="chips-row" id="moodChips"></div>
      <div class="chips-row" id="sourceChips"></div>
    </div>
  </header>

  <main class="container">
    <div class="status-bar" id="statusBar">
      <span id="statusText">피드를 불러오고 있습니다...</span>
      <button class="reset-read-btn" id="resetReadBtn" style="display:none;">읽은 기록 초기화</button>
    </div>
    <div id="contentArea"></div>
    <footer>
      각 커뮤니티의 공개 제목과 링크만 모아서 보여주며, 클릭 시 원문 페이지로 이동합니다.
    </footer>
  </main>

  <div class="modal-backdrop" id="commentModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modalPostTitle">댓글</h3>
          <div class="modal-sub" id="modalPostSub"></div>
        </div>
        <button class="icon-btn" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body" id="commentList"></div>
      <form class="modal-form" id="commentForm">
        <div class="modal-form-row">
          <input class="input-sm" id="nickInput" type="text" placeholder="닉네임 (기본: 익명)" style="width: 130px;" />
          <input class="input-sm" id="commentInput" type="text" placeholder="이 이슈에 대한 의견을 남겨보세요..." style="flex: 1;" required />
          <button class="btn-primary" type="submit">등록</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const MOOD_LABELS = {
      all: '전체 주제',
      humor: '😂 순수 유머',
      info: '💡 정보·꿀팁',
      it_econ: '💻 IT·경제',
      sports: '⚽ 스포츠·게임',
      life: '💛 일상·감동',
      politics_conflict: '🏛️ 정치·이슈'
    };

    const state = {
      items: [],
      briefing: [],
      updatedAt: '',
      aiEnabled: false,
      tab: 'issue',
      mood: 'all',
      source: 'all',
      search: '',
      sort: 'cross',
      cleanMode: loadBool('pinakes_clean', true),
      unreadOnly: loadBool('pinakes_unread_only', false),
      readIds: loadSet('pinakes_read_ids'),
      comments: loadObj('pinakes_comments'),
      expandedClusters: new Set(),
      expandedSummaries: new Set(),
      activePost: null
    };

    function loadBool(k, def) {
      try {
        const v = localStorage.getItem(k);
        return v === null ? def : v === '1';
      } catch { return def; }
    }
    function loadSet(k) {
      try {
        return new Set(JSON.parse(localStorage.getItem(k) || '[]'));
      } catch { return new Set(); }
    }
    function loadObj(k) {
      try {
        return JSON.parse(localStorage.getItem(k) || '{}');
      } catch { return {}; }
    }
    function saveReadIds() {
      try {
        localStorage.setItem('pinakes_read_ids', JSON.stringify(Array.from(state.readIds).slice(-500)));
      } catch {}
    }
    function markAsRead(id) {
      if (!id) return;
      state.readIds.add(id);
      saveReadIds();
      render();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtNum(n) {
      return n ? Number(n).toLocaleString('ko-KR') : '0';
    }

    function syncTopToggles() {
      const cleanBtn = document.getElementById('cleanBtn');
      const unreadBtn = document.getElementById('unreadBtn');
      cleanBtn.classList.toggle('active-clean', state.cleanMode);
      cleanBtn.textContent = state.cleanMode ? '🧹 클린 ON' : '🧹 클린 OFF';
      unreadBtn.classList.toggle('active-unread', state.unreadOnly);
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    function getBaseItems() {
      let list = state.items.slice();
      if (state.tab === 'issue') list = list.filter(x => x.category === 'issue');
      else if (state.tab === 'deal') list = list.filter(x => x.category === 'deal');
      if (state.cleanMode) list = list.filter(x => !x.isSensitive);
      return list;
    }

    function getFilteredItems() {
      let list = getBaseItems();
      if (state.unreadOnly) list = list.filter(x => !state.readIds.has(x.id));
      if (state.mood !== 'all' && state.tab !== 'deal') list = list.filter(x => x.mood === state.mood);
      if (state.source !== 'all') {
        list = list.filter(x => x.source === state.source || (x.communities && x.communities.includes(state.source)));
      }
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(x =>
          x.title.toLowerCase().includes(q) ||
          (x.aiSummaryTitle && x.aiSummaryTitle.toLowerCase().includes(q)) ||
          x.source.toLowerCase().includes(q)
        );
      }

      if (state.sort === 'cross') {
        list.sort((a, b) => (b.crossScore || 0) - (a.crossScore || 0));
      } else if (state.sort === 'views') {
        list.sort((a, b) => (b.views || 0) - (a.views || 0));
      } else if (state.sort === 'comments') {
        list.sort((a, b) => (b.comments || 0) - (a.comments || 0));
      } else if (state.sort === 'likes') {
        list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      }
      return list;
    }

    function renderChips() {
      const moodRow = document.getElementById('moodChips');
      const sourceRow = document.getElementById('sourceChips');
      const controlsBar = document.getElementById('controlsBar');

      if (state.tab === 'briefing') {
        moodRow.style.display = 'none';
        sourceRow.style.display = 'none';
        controlsBar.style.display = 'none';
        return;
      }

      controlsBar.style.display = 'flex';
      sourceRow.style.display = 'flex';

      if (state.tab === 'deal') {
        moodRow.style.display = 'none';
      } else {
        moodRow.style.display = 'flex';
        const keys = ['all', 'humor', 'info', 'it_econ', 'sports', 'life'];
        if (!state.cleanMode) keys.push('politics_conflict');
        if (state.cleanMode && state.mood === 'politics_conflict') state.mood = 'all';

        moodRow.innerHTML = keys.map(k =>
          `<button class="chip ${state.mood === k ? 'active' : ''}" data-mood="${k}">${MOOD_LABELS[k]}</button>`
        ).join('');
      }

      const base = getBaseItems();
      const counts = {};
      base.forEach(x => { counts[x.source] = (counts[x.source] || 0) + 1; });
      const sources = ['all', ...Object.keys(counts)];
      sourceRow.innerHTML = sources.map(s => {
        const label = s === 'all' ? `전체 (${base.length})` : `${s} (${counts[s]})`;
        return `<button class="chip ${state.source === s ? 'active' : ''}" data-src="${escapeHtml(s)}">${escapeHtml(label)}</button>`;
      }).join('');
    }

    function renderBriefing() {
      const area = document.getElementById('contentArea');
      const items = state.cleanMode ? state.briefing.filter(b => !b.isSensitive) : state.briefing;

      document.getElementById('totalBadge').textContent = `${items.length}건`;
      document.getElementById('statusText').textContent = `출퇴근 3분 브리핑 · ${state.updatedAt}`;

      if (!items.length) {
        area.innerHTML = `<div class="empty">표시할 브리핑이 없습니다. 클린 모드를 해제하거나 잠시 후 다시 확인해 주세요.</div>`;
        return;
      }

      area.innerHTML = `
        <div class="briefing-header">
          <h2>📰 지금 꼭 봐야 할 핵심 이슈 Top ${items.length}</h2>
          <p>${state.updatedAt} 기준 · ${state.aiEnabled ? 'AI 요약 적용됨' : '실시간 화제글 기준'}${state.cleanMode ? ' · 클린 모드 필터링 중' : ''}</p>
        </div>
        <div class="briefing-grid">
          ${items.map((b, i) => `
            <div class="brief-card">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <span class="brief-tag">#${i + 1} ${escapeHtml(b.tag)}</span>
                  <span style="font-size:11px; color:var(--text-muted);">${escapeHtml((b.communities || []).join('·'))}</span>
                </div>
                <a class="brief-headline" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(b.id)}">
                  ${escapeHtml(b.headline)}
                </a>
                <p class="brief-summary" style="margin-top:6px;">${escapeHtml(b.summary)}</p>
              </div>
              <div style="display:flex; justify-content:flex-end;">
                <a class="mini-btn" style="text-decoration:none;" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(b.id)}">원문 보기 ↗</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderFeed() {
      const list = getFilteredItems();
      const area = document.getElementById('contentArea');
      document.getElementById('totalBadge').textContent = `${list.length}건`;

      const readCount = state.readIds.size;
      document.getElementById('statusText').textContent =
        `표시 ${list.length}건${state.cleanMode ? ' · 클린 모드 적용' : ''}${readCount ? ` · 읽은 글 ${readCount}건` : ''}`;
      document.getElementById('resetReadBtn').style.display = readCount ? 'inline' : 'none';

      if (!list.length) {
        area.innerHTML = `<div class="empty">조건에 맞는 글이 없습니다. 검색어나 필터를 조정해 보세요.</div>`;
        return;
      }

      area.innerHTML = `<div class="feed-list">${list.map((it, idx) => {
        const isRead = state.readIds.has(it.id);
        const cCount = (state.comments[it.id] || []).length;
        const hasCross = (it.crossCount || 1) > 1 && it.relatedItems && it.relatedItems.length > 1;
        const isCrossOpen = state.expandedClusters.has(it.clusterId);
        const hasSummary = Array.isArray(it.aiThreeLineSummary) && it.aiThreeLineSummary.length > 0;
        const isSummaryOpen = state.expandedSummaries.has(it.id);

        const metaParts = [];
        if (it.views) metaParts.push(`조회 ${fmtNum(it.views)}`);
        if (it.likes) metaParts.push(`추천 ${fmtNum(it.likes)}`);
        if (it.comments) metaParts.push(`원글 댓글 ${fmtNum(it.comments)}`);
        if (it.time_label) metaParts.push(it.time_label);

        const hoverTip = hasSummary ? it.aiThreeLineSummary.join(' / ') : '';

        return `
          <article class="post-card ${isRead ? 'is-read' : ''}">
            <div class="card-top">
              <div class="badges">
                <span class="rank-num">${idx + 1}</span>
                <span class="src-badge ${it.category === 'deal' ? 'deal' : ''}">${escapeHtml(it.source)}</span>
                ${it.mood && MOOD_LABELS[it.mood] && it.category !== 'deal' ? `<span class="mood-badge">${MOOD_LABELS[it.mood]}</span>` : ''}
                ${hasCross ? `<button class="cross-badge" data-toggle-cluster="${escapeHtml(it.clusterId)}">🔥 ${escapeHtml(it.communities.join('·'))} ${it.crossCount}곳 동시 화제 ${isCrossOpen ? '▲' : '▼'}</button>` : ''}
              </div>
              ${isRead ? `<span class="read-tag">✓ 읽음</span>` : ''}
            </div>

            <a class="post-title" href="${escapeHtml(it.url)}" target="_blank" rel="noopener"
               data-read-id="${escapeHtml(it.id)}" title="${escapeHtml(hoverTip)}">
              ${escapeHtml(it.title)}${it.comments ? `<span class="reply-cnt">[${it.comments}]</span>` : ''}
            </a>

            ${it.aiSummaryTitle ? `<div class="ai-subtitle">✨ ${escapeHtml(it.aiSummaryTitle)}</div>` : ''}

            <div class="card-bottom">
              <span class="meta-line">${escapeHtml(metaParts.join(' · ') || '방금')}</span>
              <div class="card-actions">
                ${hasSummary ? `<button class="mini-btn" data-toggle-summary="${escapeHtml(it.id)}">📋 3줄 요약 ${isSummaryOpen ? '▲' : '▼'}</button>` : ''}
                <button class="mini-btn ${cCount ? 'has-comments' : ''}" data-open-comment="${escapeHtml(it.id)}">💬 댓글${cCount ? ` ${cCount}` : ''}</button>
              </div>
            </div>

            ${isSummaryOpen && hasSummary ? `
              <div class="drawer">
                <strong>📋 핵심 요약</strong>
                <ul>${it.aiThreeLineSummary.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
              </div>
            ` : ''}

            ${isCrossOpen && hasCross ? `
              <div class="drawer">
                <strong>🔗 묶인 커뮤니티 글 (${it.relatedItems.length}건)</strong>
                <ul>
                  ${it.relatedItems.map(m => `
                    <li>
                      <span style="font-weight:700;">[${escapeHtml(m.source)}]</span>
                      <a class="related-link" href="${escapeHtml(m.url)}" target="_blank" rel="noopener" data-read-id="${escapeHtml(it.id)}">${escapeHtml(m.title)}</a>
                    </li>
                  `).join('')}
                </ul>
                ${it.opinionCompare ? `<div class="opinion-box"><strong>⚖️ 여론 비교:</strong> ${escapeHtml(it.opinionCompare)}</div>` : ''}
              </div>
            ` : ''}
          </article>
        `;
      }).join('')}</div>`;
    }

    function render() {
      syncTopToggles();
      renderChips();
      if (state.tab === 'briefing') renderBriefing();
      else renderFeed();
    }

    function openCommentModal(postId) {
      const post = state.items.find(x => x.id === postId);
      if (!post) return;
      state.activePost = post;
      document.getElementById('modalPostTitle').textContent = post.title;
      document.getElementById('modalPostSub').textContent = `${post.source} · 이 기기 브라우저에 댓글이 저장됩니다`;
      renderComments();
      document.getElementById('commentModal').classList.add('open');
    }

    function renderComments() {
      const listEl = document.getElementById('commentList');
      const post = state.activePost;
      if (!post) return;
      const arr = state.comments[post.id] || [];
      if (!arr.length) {
        listEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:24px 0; font-size:13px;">첫 댓글을 남겨보세요!</div>`;
        return;
      }
      listEl.innerHTML = arr.map((c, idx) => `
        <div class="comment-item">
          <div class="comment-head">
            <span><strong>${escapeHtml(c.nick)}</strong> · ${escapeHtml(c.time)}</span>
            <button class="comment-del" data-del-idx="${idx}">삭제</button>
          </div>
          <div style="font-size:13.5px;">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    }

    document.addEventListener('click', (e) => {
      const t = e.target;

      const tabBtn = t.closest('[data-tab]');
      if (tabBtn) {
        state.tab = tabBtn.dataset.tab;
        state.source = 'all';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === tabBtn));
        render();
        return;
      }

      const moodBtn = t.closest('[data-mood]');
      if (moodBtn) {
        state.mood = moodBtn.dataset.mood;
        render();
        return;
      }

      const srcBtn = t.closest('[data-src]');
      if (srcBtn) {
        state.source = srcBtn.dataset.src;
        render();
        return;
      }

      const readLink = t.closest('[data-read-id]');
      if (readLink) {
        markAsRead(readLink.dataset.readId);
        return;
      }

      const clBtn = t.closest('[data-toggle-cluster]');
      if (clBtn) {
        const cid = clBtn.dataset.toggleCluster;
        if (state.expandedClusters.has(cid)) state.expandedClusters.delete(cid);
        else state.expandedClusters.add(cid);
        render();
        return;
      }

      const sumBtn = t.closest('[data-toggle-summary]');
      if (sumBtn) {
        const pid = sumBtn.dataset.toggleSummary;
        if (state.expandedSummaries.has(pid)) state.expandedSummaries.delete(pid);
        else state.expandedSummaries.add(pid);
        render();
        return;
      }

      const cmtBtn = t.closest('[data-open-comment]');
      if (cmtBtn) {
        openCommentModal(cmtBtn.dataset.openComment);
        return;
      }

      const delBtn = t.closest('[data-del-idx]');
      if (delBtn && state.activePost) {
        const idx = Number(delBtn.dataset.delIdx);
        const arr = state.comments[state.activePost.id] || [];
        arr.splice(idx, 1);
        state.comments[state.activePost.id] = arr;
        try { localStorage.setItem('pinakes_comments', JSON.stringify(state.comments)); } catch {}
        renderComments();
        render();
      }
    });

    document.getElementById('cleanBtn').addEventListener('click', () => {
      state.cleanMode = !state.cleanMode;
      try { localStorage.setItem('pinakes_clean', state.cleanMode ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('unreadBtn').addEventListener('click', () => {
      state.unreadOnly = !state.unreadOnly;
      try { localStorage.setItem('pinakes_unread_only', state.unreadOnly ? '1' : '0'); } catch {}
      render();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('pinakes_theme', isDark ? 'dark' : 'light'); } catch {}
      syncTopToggles();
    });

    document.getElementById('resetReadBtn').addEventListener('click', () => {
      state.readIds.clear();
      saveReadIds();
      render();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      render();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('commentModal').classList.remove('open');
    });
    document.getElementById('commentModal').addEventListener('click', (e) => {
      if (e.target.id === 'commentModal') document.getElementById('commentModal').classList.remove('open');
    });

    document.getElementById('commentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!state.activePost) return;
      const nick = document.getElementById('nickInput').value.trim() || '익명';
      const text = document.getElementById('commentInput').value.trim();
      if (!text) return;
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      if (!state.comments[state.activePost.id]) state.comments[state.activePost.id] = [];
      state.comments[state.activePost.id].push({ nick, text, time });
      try { localStorage.setItem('pinakes_comments', JSON.stringify(state.comments)); } catch {}
      document.getElementById('commentInput').value = '';
      renderComments();
      render();
    });

    fetch('data.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        state.items = data.items || [];
        state.briefing = data.briefing || [];
        state.updatedAt = data.updated_at || '';
        state.aiEnabled = Boolean(data.ai_enabled);
        document.getElementById('updatedAt').textContent = state.updatedAt ? `갱신 ${state.updatedAt}` : '';
        render();
      })
      .catch(() => {
        document.getElementById('contentArea').innerHTML = `<div class="empty">피드를 불러오지 못했습니다.</div>`;
      });
  </script>
</body>
</html>
